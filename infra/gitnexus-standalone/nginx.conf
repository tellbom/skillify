server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://gitnexus-server:4747;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        # GitNexus upstream restricts wildcard-bound write routes to loopback.
        # This gateway is the trusted inner-network entrypoint.
        proxy_set_header Origin http://127.0.0.1:4747;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://gitnexus-web:4173;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The upstream UI references Google Fonts. Replace those URLs so an
        # air-gapped browser uses local fallback fonts without public requests.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'https://fonts.googleapis.com' 'about:blank';
        sub_filter 'https://fonts.gstatic.com' 'about:blank';
    }
}

server {
    listen 4747;
    server_name _;
    client_max_body_size 0;

    location / {
        proxy_pass http://gitnexus-server:4747;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Origin http://127.0.0.1:4747;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
